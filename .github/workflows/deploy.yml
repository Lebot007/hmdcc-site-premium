# Deploy automático para GitHub Pages
#
# Em todo push na branch main o site é buildado como export estático
# (pastas ./out) e publicado em https://lebot007.github.io/hmdcc-site-premium/
#
# Requisitos (já configurados no repo):
#   - Settings → Pages → Build and deployment → Source: GitHub Actions
#
# O basePath (/hmdcc-site-premium) é injetado via NEXT_PUBLIC_BASE_PATH,
# pois o Pages publica o site em /<nome-do-repo>/, não na raiz do domínio.

name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build estático (Next.js export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do site estático
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:static

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
